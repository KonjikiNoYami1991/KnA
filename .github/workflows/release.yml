name: Release

# Runs only when a version tag is pushed (git tag v3.1.0 && git push origin v3.1.0).
# One complete, ready-to-run package per system (everything inside: FFmpeg, fdkaac, GPU encoders, models…),
# named as the in-app updater expects (AppUpdater.AssetName):
#   Windows   KnA-Windows-x64.zip · KnA-Windows-ARM64.zip · KnA-Server-Windows-x64.zip
#   macOS     KnA-macOS-AppleSilicon.zip · KnA-macOS-Intel.zip            (KnA.app)
#   Linux     KnA-Linux-x64.tar.gz · KnA-Linux-ARM64.tar.gz · KnA-Server-Linux-x64.tar.gz · KnA-Server-Linux-ARM64.tar.gz
# attached to a *draft* release, published by hand after a check. fdkaac (built here, used by Settings → Components
# on installations without it) goes to the rolling "components" pre-release, not to every version.
# It can also be started by hand with a version number (the tag is then created by GitHub).
on:
  push:
    tags: ["v*"]
  # Manual run (Actions → Release → Run workflow): GitHub creates the tag on the chosen commit itself.
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v (e.g. 3.0.0)"
        required: true
      draft:
        description: "Leave the release as a draft"
        type: boolean
        default: true
      test_package:
        description: "Test package only (no release, no tag, no Docker image): the package to build, e.g. Windows-x64; empty = full release"
        required: false
        default: ""

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- fdkaac (Fraunhofer AAC, standalone program)
  fdkaac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04, target: win-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: osx }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ${{ matrix.target == 'win-x64' && 'mingw-w64' || '' }}
      - name: Build
        run: bash build/build-fdkaac.sh ${{ matrix.target }} out
      - name: Package for the component manager
        run: |
          cd out
          case "${{ matrix.target }}" in
            win-x64|osx) zip -q "../fdkaac-${{ matrix.target }}.zip" * ;;
            *) tar -czf "../fdkaac-${{ matrix.target }}.tar.gz" * ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: fdkaac-${{ matrix.target }}
          path: |
            out/
            fdkaac-${{ matrix.target }}.*

  # ---------------------------------------------------------------- Tesseract (subtitle OCR), static, Linux
  # Windows uses the Tesseract 5.5.0 package Subtitle Edit ships (component "tesseract"); macOS the Homebrew build,
  # made relocatable inside KnA.app (see the macOS step).
  tesseract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Build
        run: bash build/build-tesseract.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: tesseract-${{ matrix.target }}
          path: out/

  # ---------------------------------------------------------------- KnA packages
  # ---------------------------------------------------------------- which packages
  # name = package suffix; server = also the server edition (Windows on Arm and Macs: desktop only, a Mac or Arm PC
  # used as a server runs the Docker image or the Linux package in a VM). fdk: fdkaac build (Windows on Arm: x64,
  # emulated). macos-14: the Homebrew tools bundled in KnA.app then run on macOS 14+; macos-15-intel: x86_64 builds.
  # A test run (input test_package) builds that one package only and leaves it as a workflow artifact.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          TEST: ${{ inputs.test_package }}
        run: |
          all='[
            {"os":"windows-latest","rid":"win-x64","fdk":"win-x64","name":"Windows-x64","server":true},
            {"os":"windows-latest","rid":"win-arm64","fdk":"win-x64","name":"Windows-ARM64","server":false},
            {"os":"macos-14","rid":"osx-arm64","fdk":"osx","name":"macOS-AppleSilicon","server":false},
            {"os":"macos-15-intel","rid":"osx-x64","fdk":"osx","name":"macOS-Intel","server":false},
            {"os":"ubuntu-24.04","rid":"linux-x64","fdk":"linux-x64","name":"Linux-x64","server":true},
            {"os":"ubuntu-24.04-arm","rid":"linux-arm64","fdk":"linux-arm64","name":"Linux-ARM64","server":true}]'
          if [ -n "$TEST" ]; then m=$(echo "$all" | jq -c --arg n "$TEST" 'map(select(.name == $n))'); else m=$(echo "$all" | jq -c .); fi
          [ "$m" != "[]" ] || { echo "::error::Unknown package $TEST"; exit 1; }
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  build:
    needs: [plan, fdkaac, tesseract]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Publish
        shell: bash
        run: |
          # One executable (the .NET runtime and every assembly inside) plus the few native libraries Avalonia/Skia load.
          sf="-p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none"
          dotnet publish src/KnA.App -c Release -r ${{ matrix.rid }} --self-contained $sf -p:Version=$VERSION -o out/desktop
          if [ "${{ matrix.server }}" = true ]; then
            dotnet publish src/KnA.Server -c Release -r ${{ matrix.rid }} --self-contained $sf -p:Version=$VERSION -o out/server
          fi
      - name: fdkaac
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fdkaac-${{ matrix.fdk }}
          path: fdk
      - name: Bundle fdkaac
        shell: bash
        run: |
          if [ -d fdk/out ]; then
            for d in out/desktop out/server; do [ -d "$d" ] && mkdir -p "$d/tools" && cp fdk/out/* "$d/tools/"; done
          else
            echo "::warning::fdkaac not available for ${{ matrix.rid }}: AAC falls back to FFmpeg's encoder"
          fi
      # Portable editions (desktop and server): everything in one folder, each dependency in its own subfolder:
      #   KnA(.exe) + native libs · portable.txt · tools/ffmpeg (BtbN GPL build) · tools/fdkaac · tools/nvencc,qsvencc,vceencc
      #   (rigaya) · tools/qaac (without Apple's files: extracted from iTunes on the user's machine) · tools/vapoursynth
      #   (portable Python 3.13 + VapourSynth + vsjetpack + the catalogue's plugins, every platform) · tools/dovi_tool,
      #   hdr10plus_tool · tools/mkvtoolnix (mkvmerge: Dolby Vision configuration record) · tools/shaders · ai/models
      #   (Real-ESRGAN) · data/ (settings, queue, logs, temp). PyTorch is not included: its build depends on the GPU
      #   (CUDA / ROCm / XPU / CPU) and weighs several GB, Settings → Components installs the right one.
      - name: Tesseract (static build)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: tesseract-${{ matrix.rid }}
          path: tess
      - name: Tools bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KNA_GITHUB_TOKEN: ${{ github.token }}
        run: |
          b=bundle
          mkdir -p "$b/data" && touch "$b/portable.txt"
          if [ -d fdk/out ]; then mkdir -p "$b/tools/fdkaac" && cp fdk/out/* "$b/tools/fdkaac/"; fi
          if [ -d tess ]; then mkdir -p "$b/tools/tesseract" && cp tess/* "$b/tools/tesseract/" && chmod 755 "$b/tools/tesseract/tesseract"; fi
          # FFmpeg: newest release-branch GPL build from BtbN for this platform (macOS: Homebrew, next step)
          if [ "$RUNNER_OS" != macOS ]; then
          case "${{ matrix.rid }}" in
            win-x64) t=win64 ;; win-arm64) t=winarm64 ;; linux-x64) t=linux64 ;; linux-arm64) t=linuxarm64 ;;
          esac
          asset=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets -q '.assets[].name' \
            | grep -E "^ffmpeg-n[0-9]+\.[0-9]+-latest-$t-gpl-[0-9]+\.[0-9]+\.(zip|tar\.xz)$" | sort -V | tail -1)
          if [ -z "$asset" ]; then asset=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets -q '.assets[].name' | grep -E "^ffmpeg-master-latest-$t-gpl\.(zip|tar\.xz)$" | head -1); fi
          echo "FFmpeg: $asset"
          gh release download latest -R BtbN/FFmpeg-Builds -p "$asset" -D ffdl
          mkdir -p ffx
          case "$asset" in
            *.zip) if command -v unzip >/dev/null; then unzip -q "ffdl/$asset" -d ffx; else 7z x -offx "ffdl/$asset" >/dev/null; fi ;;
            *) tar -xJf "ffdl/$asset" -C ffx ;;
          esac
          mkdir -p "$b/tools/ffmpeg"
          for exe in ffmpeg ffprobe ffmpeg.exe ffprobe.exe; do
            f=$(find ffx -type f -name "$exe" | head -1)
            if [ -n "$f" ]; then cp "$f" "$b/tools/ffmpeg/"; fi
          done
          ls "$b/tools/ffmpeg" | grep -q '^ffmpeg' || { echo "::error::FFmpeg not found in $asset"; exit 1; }
          lic=$(find ffx -maxdepth 2 -type f -name 'LICENSE*' | head -1)
          if [ -n "$lic" ]; then cp "$lic" "$b/tools/ffmpeg/LICENSE.txt"; fi
          printf '%s\n' "FFmpeg $asset - https://github.com/BtbN/FFmpeg-Builds (build scripts) and https://ffmpeg.org (source code)." \
            "GPL licensed: see LICENSE.txt. KnA runs it as a separate program." > "$b/tools/ffmpeg/SOURCE.txt"
          fi

          # Everything else is installed by KnA's own component manager (same folders and checks as in the app).
          models="model:realesr-animevideov3,model:RealESRGAN_x4plus_anime_6B,model:realesr-general-x4v3,model:RealESRGAN_x4plus,model:RealESRGAN_x2plus"
          # Every package is complete (CLAUDE.md): OCR models, the archive engine (portable Python + py7zr), shaders,
          # upscale models. Only PaddleOCR and PyTorch (GBs, GPU-specific) stay one click away in Settings → Components.
          common="archive,anime4k,fsrcnnx,ocr:eng,ocr:ita,$models"
          # VapourSynth everywhere: portable Python 3.13 + VapourSynth + vsjetpack + the filter catalogue's plugins (wheels),
          # checked by loading every plugin (the install fails otherwise).
          case "${{ matrix.rid }}" in
            win-x64)     ids="nvencc,qsvencc,vceencc,qaac,vapoursynth,dovi_tool,hdr10plus_tool,tesseract,$common,mkvtoolnix" ;;
            linux-x64)   ids="nvencc,qsvencc,vceencc,vapoursynth,dovi_tool,hdr10plus_tool,$common" ;;
            linux-arm64) ids="vapoursynth,dovi_tool,hdr10plus_tool,$common" ;;
            # built on an x64 runner: x64 programs, which Windows on Arm runs through its x64 emulation
            win-arm64)   ids="vapoursynth,dovi_tool,hdr10plus_tool,tesseract,$common,mkvtoolnix" ;;
            *)           ids="vapoursynth,dovi_tool,hdr10plus_tool,$common" ;;   # macOS (FFmpeg and Tesseract from the next step)
          esac
          # Absolute path: "dotnet run" starts in the project folder (pwd -W = Windows form under Git Bash).
          abs=$(cd "$b" && { pwd -W 2>/dev/null || pwd; })
          dotnet run --project src/KnA.Server -c Release -- --bundle "$abs" "$ids" || echo "::warning::Some components could not be bundled for ${{ matrix.rid }} (see the log)"
          # VapourSynth is required in every package (CLAUDE.md): stop here rather than publish a package without it.
          find "$b/tools/vapoursynth" -name 'vspipe*' -type f | grep -q . || { echo "::error::VapourSynth missing from the ${{ matrix.rid }} package"; exit 1; }
          # mkvmerge (Dolby Vision configuration record): Windows from MKVToolNix's portable build here, Linux and macOS below.
          if [ "$RUNNER_OS" = Windows ]; then
            find "$b/tools/mkvtoolnix" -name 'mkvmerge.exe' -type f | grep -q . || { echo "::error::mkvmerge missing from the ${{ matrix.rid }} package"; exit 1; }
          fi
          rm -rf "$b/data/temp"
          du -sh "$b"/tools/* "$b"/ai 2>/dev/null || true
      # Linux: mkvmerge (Dolby Vision configuration record) from the distribution's package, with the libraries it loads
      # copied next to it and a small launcher that points the loader at them (no system package needed).
      - name: mkvmerge (Linux, with its libraries)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends mkvtoolnix
          d=bundle/tools/mkvtoolnix
          mkdir -p "$d/lib"
          cp "$(command -v mkvmerge)" "$d/mkvmerge.bin"
          ldd "$d/mkvmerge.bin" | awk '/=> \//{print $3}' | grep -vE '/(libc|libm|libdl|libpthread|librt|ld-linux[^/]*)\.so' | xargs -I{} cp -L {} "$d/lib/"
          printf '%s\n' '#!/bin/sh' 'd=$(dirname "$(readlink -f "$0")")' \
            'LD_LIBRARY_PATH="$d/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$d/mkvmerge.bin" "$@"' > "$d/mkvmerge"
          chmod 755 "$d/mkvmerge" "$d/mkvmerge.bin"
          cp /usr/share/doc/mkvtoolnix/copyright "$d/COPYING.txt" 2>/dev/null || true
          printf '%s\n' "mkvmerge $(dpkg-query -W -f='${Version}' mkvtoolnix) from Ubuntu (https://mkvtoolnix.download), GPLv2, with its libraries." \
            "KnA runs it as a separate program to write the Dolby Vision configuration record." > "$d/SOURCE.txt"
          env -i "$d/mkvmerge" --version
      # macOS: FFmpeg, Tesseract and mkvmerge from Homebrew, made relocatable (every library they load copied next to them and
      # their load paths rewritten), so KnA.app works on a Mac without Homebrew.
      - name: FFmpeg, Tesseract and mkvmerge (macOS, relocatable)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg tesseract mkvtoolnix dylibbundler
          for tool in ffmpeg tesseract mkvtoolnix; do
            d=bundle/tools/$tool
            mkdir -p "$d/libs"
            case $tool in ffmpeg) exes="ffmpeg ffprobe" ;; mkvtoolnix) exes="mkvmerge" ;; *) exes="tesseract" ;; esac
            args=()
            for e in $exes; do cp "$(brew --prefix)/bin/$e" "$d/$e"; chmod 755 "$d/$e"; args+=(-x "$d/$e"); done
            dylibbundler -od -b "${args[@]}" -d "$d/libs" -p @executable_path/libs/
          done
          printf '%s\n' "FFmpeg $(brew list --versions ffmpeg | cut -d' ' -f2) from Homebrew (https://formulae.brew.sh/formula/ffmpeg), libraries bundled with dylibbundler." \
            "GPL licensed (https://ffmpeg.org/legal.html). KnA runs it as a separate program." > bundle/tools/ffmpeg/SOURCE.txt
          printf '%s\n' "Tesseract $(brew list --versions tesseract | cut -d' ' -f2) from Homebrew, Apache-2.0 (https://github.com/tesseract-ocr/tesseract)." > bundle/tools/tesseract/SOURCE.txt
          printf '%s\n' "mkvmerge $(brew list --versions mkvtoolnix | cut -d' ' -f2) from Homebrew (https://mkvtoolnix.download), GPLv2, libraries bundled with dylibbundler." > bundle/tools/mkvtoolnix/SOURCE.txt
          bundle/tools/mkvtoolnix/mkvmerge --version | head -1
          bundle/tools/ffmpeg/ffmpeg -hide_banner -version | head -1
          bundle/tools/tesseract/tesseract --version | head -1
      - name: Portable layout
        if: runner.os != 'macOS'
        shell: bash
        run: |
          note() {
            cat > "$1/portable.txt" <<'EOF'
          KnA portable: everything stays in this folder. data = settings, presets, queue, logs, temporary files;
          tools = FFmpeg, fdkaac, NVEncC/QSVEncC/VCEEncC, qaac, VapourSynth and the other programs (updates from
          Settings → Components go here too); ai = the AI upscaler (models included; PyTorch from Settings → Components).
          qaac needs Apple's CoreAudioToolbox: Settings → Components → qaac → Install extracts it from the iTunes setup.
          Delete this file to use the per-user folder instead.

          KnA portable: tutto resta in questa cartella. data = impostazioni, preset, coda, log, file temporanei;
          tools = FFmpeg, fdkaac, NVEncC/QSVEncC/VCEEncC, qaac, VapourSynth e gli altri programmi (anche gli
          aggiornamenti da Impostazioni → Componenti); ai = l'upscaler AI (modelli inclusi; PyTorch da Impostazioni → Componenti).
          qaac ha bisogno di CoreAudioToolbox di Apple: Impostazioni → Componenti → qaac → Installa lo estrae dal setup di iTunes.
          Elimina questo file per usare la cartella dell'utente.
          EOF
            sed -i.bak 's/^          //' "$1/portable.txt" && rm "$1/portable.txt.bak"
          }
          for v in desktop server; do
            [ -d out/$v ] || continue
            if [ "$v" = server ]; then k=portable-server/KnA-server; else k=portable-desktop/KnA; fi
            mkdir -p "$(dirname "$k")" && cp -R out/$v "$k"
            rm -rf "$k/tools"   # the flat fdkaac copy of the plain package: the bundle has tools/fdkaac
            cp -R bundle/tools "$k/tools"
            if [ -d bundle/ai ]; then cp -R bundle/ai "$k/ai"; fi
            mkdir -p "$k/data" && if [ -d bundle/data/tools ]; then cp -R bundle/data/tools "$k/data/tools"; fi
            note "$k"
            echo "== $k" && du -sh "$k"
          done
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path portable-desktop/KnA -DestinationPath KnA-${{ matrix.name }}.zip
          if (Test-Path portable-server/KnA-server) { Compress-Archive -Path portable-server/KnA-server -DestinationPath KnA-Server-${{ matrix.name }}.zip }
      - name: Package (Linux, keeps the executable bit)
        if: runner.os == 'Linux'
        run: |
          tar -C portable-desktop -czf KnA-${{ matrix.name }}.tar.gz KnA
          if [ -d portable-server/KnA-server ]; then tar -C portable-server -czf KnA-Server-${{ matrix.name }}.tar.gz KnA-server; fi
      - name: macOS app bundle (icon, Finder, Dock)
        if: runner.os == 'macOS'
        run: |
          app=KnA.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R out/desktop/. "$app/Contents/MacOS/"
          # the complete tool set inside the app (read-only resources; settings and downloads go to the user's folder)
          rm -rf "$app/Contents/MacOS/tools"
          cp -R bundle/tools "$app/Contents/MacOS/tools"
          if [ -d bundle/ai ]; then cp -R bundle/ai "$app/Contents/MacOS/ai"; fi
          cp branding/kna.icns "$app/Contents/Resources/kna.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>KnA</string>
            <key>CFBundleDisplayName</key><string>KnA · Konjiki no Autoencoder</string>
            <key>CFBundleIdentifier</key><string>io.github.konjikinoyami1991.kna</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleExecutable</key><string>KnA</string>
            <key>CFBundleIconFile</key><string>kna.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          sed -i '' 's/^          //' "$app/Contents/Info.plist"
          # ad-hoc signature for every program and library (dylibbundler rewrote them; Apple Silicon refuses unsigned code)
          find "$app/Contents/MacOS" -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.so' \) -print0 \
            | xargs -0 -n 50 codesign --force --sign - 2>/dev/null || true
          codesign --force --deep --sign - "$app" || true
          ditto -c -k --keepParent "$app" "KnA-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kna-${{ matrix.rid }}
          path: |
            KnA-*.zip
            KnA-*.tar.gz

  # ---------------------------------------------------------------- Docker image (ghcr.io/<owner>/kna)
  # Each architecture on its own runner (no emulation), then one multi-arch tag. ":<version>" now; ":latest"
  # follows when the draft release is published (docker-latest.yml), so nobody pulls an unreleased version.
  docker:
    if: ${{ !inputs.test_package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kna" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.title=KnA - Konjiki no Autoencoder

  docker-manifest:
    needs: docker
    if: ${{ !inputs.test_package }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Multi-arch tag
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kna
          V=${TAG#v}
          docker buildx imagetools create -t "$IMAGE:$V" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"

  release:
    needs: [fdkaac, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && !inputs.test_package }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Release notes: this version's section of CHANGELOG.md (GitHub's generated list of changes is appended).
      - name: Notes from the changelog
        run: |
          awk -v tag="$TAG" '$0 ~ "^## " tag "([^0-9.]|$)" {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md > notes.md
          wc -l notes.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          draft=--draft
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.draft }}" == false ]]; then draft=; fi
          notes=(); [[ -s notes.md ]] && notes=(--notes-file notes.md)
          gh release create "$TAG" dist/KnA-*.zip dist/KnA-*.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $draft "${notes[@]}" --generate-notes --title "KnA $TAG"
      # fdkaac for Settings → Components (installations without the bundled copy): one rolling pre-release, replaced
      # by every build, so the version releases list only the KnA packages.
      - name: Components release (fdkaac)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/fdkaac-*.zip dist/fdkaac-*.tar.gz)
          [[ ${#files[@]} -gt 0 ]] || { echo "::warning::no fdkaac build to publish"; exit 0; }
          gh release view components --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create components --repo "$GITHUB_REPOSITORY" --prerelease --title "KnA components" \
                 --notes "Programs built by KnA's release workflow and installed by Settings → Components (fdkaac). Not a KnA version: download KnA from the latest release."
          gh release upload components "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
