name: Release

# Runs only when a version tag is pushed (git tag v3.1.0 && git push origin v3.1.0).
# Builds self-contained packages named as the in-app updater expects (KnA-{desktop|server}-{rid}.zip),
# bundles the standalone fdkaac encoder (best AAC, redistributable on its own), adds a macOS KnA.app
# with its icon, and attaches everything to a *draft* release, published by hand after a check.
# It can also be started by hand with a version number (the tag is then created by GitHub).
on:
  push:
    tags: ["v*"]
  # Manual run (Actions → Release → Run workflow): GitHub creates the tag on the chosen commit itself.
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v (e.g. 3.0.0)"
        required: true
      draft:
        description: "Leave the release as a draft"
        type: boolean
        default: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- fdkaac (Fraunhofer AAC, standalone program)
  fdkaac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04, target: win-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: osx }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ${{ matrix.target == 'win-x64' && 'mingw-w64' || '' }}
      - name: Build
        run: bash build/build-fdkaac.sh ${{ matrix.target }} out
      - name: Package for the component manager
        run: |
          cd out
          case "${{ matrix.target }}" in
            win-x64|osx) zip -q "../fdkaac-${{ matrix.target }}.zip" * ;;
            *) tar -czf "../fdkaac-${{ matrix.target }}.tar.gz" * ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: fdkaac-${{ matrix.target }}
          path: |
            out/
            fdkaac-${{ matrix.target }}.*

  # ---------------------------------------------------------------- KnA packages
  build:
    needs: fdkaac
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, fdk: win-x64 }
          - { os: windows-latest, rid: win-arm64, fdk: win-x64 }   # x64 emulation on Windows on Arm
          - { os: macos-latest, rid: osx-arm64, fdk: osx }
          - { os: macos-latest, rid: osx-x64, fdk: osx }
          - { os: ubuntu-24.04, rid: linux-x64, fdk: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, fdk: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/KnA.App -c Release -r ${{ matrix.rid }} --self-contained -p:Version=$VERSION -o out/desktop
          dotnet publish src/KnA.Server -c Release -r ${{ matrix.rid }} --self-contained -p:Version=$VERSION -o out/server
      - name: fdkaac
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fdkaac-${{ matrix.fdk }}
          path: fdk
      - name: Bundle fdkaac
        shell: bash
        run: |
          if [ -d fdk/out ]; then
            for d in out/desktop out/server; do mkdir -p "$d/tools" && cp fdk/out/* "$d/tools/"; done
          else
            echo "::warning::fdkaac not available for ${{ matrix.rid }}: AAC falls back to FFmpeg's encoder"
          fi
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path out/desktop/* -DestinationPath KnA-desktop-${{ matrix.rid }}.zip
          Compress-Archive -Path out/server/* -DestinationPath KnA-server-${{ matrix.rid }}.zip
      - name: Zip (keeps the executable bit)
        if: runner.os != 'Windows'
        run: |
          (cd out/desktop && zip -qry "$GITHUB_WORKSPACE/KnA-desktop-${{ matrix.rid }}.zip" .)
          (cd out/server && zip -qry "$GITHUB_WORKSPACE/KnA-server-${{ matrix.rid }}.zip" .)
      # Portable desktop edition: same files plus portable.txt, so settings, presets, queue, logs and the
      # FFmpeg/AI components downloaded from the app live in a "data" folder next to the program.
      - name: Portable marker
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p portable && cp -R out/desktop portable/KnA
          cat > portable/KnA/portable.txt <<'EOF'
          KnA portable: settings, presets, queue, logs and downloaded components (FFmpeg, shaders, AI models)
          are kept in the "data" folder next to this file. Delete this file to use the per-user folder instead.

          KnA portable: impostazioni, preset, coda, log e componenti scaricati (FFmpeg, shader, modelli AI)
          stanno nella cartella "data" accanto a questo file. Elimina questo file per usare la cartella dell'utente.
          EOF
          sed -i.bak 's/^          //' portable/KnA/portable.txt && rm portable/KnA/portable.txt.bak
      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path portable/KnA -DestinationPath KnA-portable-${{ matrix.rid }}.zip
      - name: Portable tarball (Linux)
        if: runner.os == 'Linux'
        run: tar -C portable -czf KnA-portable-${{ matrix.rid }}.tar.gz KnA
      - name: macOS app bundle (icon, Finder, Dock)
        if: runner.os == 'macOS'
        run: |
          app=KnA.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R out/desktop/. "$app/Contents/MacOS/"
          cp branding/kna.icns "$app/Contents/Resources/kna.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>KnA</string>
            <key>CFBundleDisplayName</key><string>KnA · Konjiki no Autoencoder</string>
            <key>CFBundleIdentifier</key><string>io.github.konjikinoyami1991.kna</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleExecutable</key><string>KnA</string>
            <key>CFBundleIconFile</key><string>kna.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          sed -i '' 's/^          //' "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app" || true
          ditto -c -k --keepParent "$app" "KnA-macOS-${{ matrix.rid }}.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kna-${{ matrix.rid }}
          path: |
            KnA-*.zip
            KnA-*.tar.gz

  release:
    needs: [fdkaac, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Release notes: this version's section of CHANGELOG.md (GitHub's generated list of changes is appended).
      - name: Notes from the changelog
        run: |
          awk -v tag="$TAG" '$0 ~ "^## " tag "([^0-9.]|$)" {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md > notes.md
          wc -l notes.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          draft=--draft
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.draft }}" == false ]]; then draft=; fi
          notes=(); [[ -s notes.md ]] && notes=(--notes-file notes.md)
          gh release create "$TAG" dist/*.zip dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $draft "${notes[@]}" --generate-notes --title "KnA $TAG"
