name: Release

# Runs only when a version tag is pushed (git tag v3.1.0 && git push origin v3.1.0).
# Builds self-contained packages named as the in-app updater expects (KnA-{desktop|server}-{rid}.zip),
# bundles the standalone fdkaac encoder (best AAC, redistributable on its own), adds a macOS KnA.app
# with its icon, and attaches everything to a *draft* release, published by hand after a check.
# It can also be started by hand with a version number (the tag is then created by GitHub).
on:
  push:
    tags: ["v*"]
  # Manual run (Actions → Release → Run workflow): GitHub creates the tag on the chosen commit itself.
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v (e.g. 3.0.0)"
        required: true
      draft:
        description: "Leave the release as a draft"
        type: boolean
        default: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- fdkaac (Fraunhofer AAC, standalone program)
  fdkaac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04, target: win-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: osx }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ${{ matrix.target == 'win-x64' && 'mingw-w64' || '' }}
      - name: Build
        run: bash build/build-fdkaac.sh ${{ matrix.target }} out
      - name: Package for the component manager
        run: |
          cd out
          case "${{ matrix.target }}" in
            win-x64|osx) zip -q "../fdkaac-${{ matrix.target }}.zip" * ;;
            *) tar -czf "../fdkaac-${{ matrix.target }}.tar.gz" * ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: fdkaac-${{ matrix.target }}
          path: |
            out/
            fdkaac-${{ matrix.target }}.*

  # ---------------------------------------------------------------- KnA packages
  build:
    needs: fdkaac
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, fdk: win-x64 }
          - { os: windows-latest, rid: win-arm64, fdk: win-x64 }   # x64 emulation on Windows on Arm
          - { os: macos-latest, rid: osx-arm64, fdk: osx }
          - { os: macos-latest, rid: osx-x64, fdk: osx }
          - { os: ubuntu-24.04, rid: linux-x64, fdk: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, fdk: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Publish
        shell: bash
        run: |
          # One executable (the .NET runtime and every assembly inside) plus the few native libraries Avalonia/Skia load.
          sf="-p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none"
          dotnet publish src/KnA.App -c Release -r ${{ matrix.rid }} --self-contained $sf -p:Version=$VERSION -o out/desktop
          dotnet publish src/KnA.Server -c Release -r ${{ matrix.rid }} --self-contained $sf -p:Version=$VERSION -o out/server
      - name: fdkaac
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fdkaac-${{ matrix.fdk }}
          path: fdk
      - name: Bundle fdkaac
        shell: bash
        run: |
          if [ -d fdk/out ]; then
            for d in out/desktop out/server; do mkdir -p "$d/tools" && cp fdk/out/* "$d/tools/"; done
          else
            echo "::warning::fdkaac not available for ${{ matrix.rid }}: AAC falls back to FFmpeg's encoder"
          fi
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path out/desktop/* -DestinationPath KnA-desktop-${{ matrix.rid }}.zip
          Compress-Archive -Path out/server/* -DestinationPath KnA-server-${{ matrix.rid }}.zip
      - name: Zip (keeps the executable bit)
        if: runner.os != 'Windows'
        run: |
          (cd out/desktop && zip -qry "$GITHUB_WORKSPACE/KnA-desktop-${{ matrix.rid }}.zip" .)
          (cd out/server && zip -qry "$GITHUB_WORKSPACE/KnA-server-${{ matrix.rid }}.zip" .)
      # Portable desktop edition: everything in one folder, each dependency in its own subfolder:
      #   KnA(.exe) + native libs · portable.txt · tools/ffmpeg (FFmpeg + FFprobe, BtbN GPL build) · tools/fdkaac
      #   · ai/ (sidecar; portable Python, PyTorch and models when installed) · data/ (settings, queue, logs, temp).
      - name: Portable layout
        if: runner.os != 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p portable && cp -R out/desktop portable/KnA
          k=portable/KnA
          # fdkaac in its own folder (the plain packages keep it in tools/)
          if [ -d "$k/tools" ]; then mkdir -p "$k/tools/fdkaac" && find "$k/tools" -maxdepth 1 -type f -exec mv {} "$k/tools/fdkaac/" \; ; fi
          # FFmpeg: newest release-branch GPL build from BtbN for this platform
          case "${{ matrix.rid }}" in
            win-x64) t=win64 ;; win-arm64) t=winarm64 ;; linux-x64) t=linux64 ;; linux-arm64) t=linuxarm64 ;;
          esac
          asset=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets -q '.assets[].name' \
            | grep -E "^ffmpeg-n[0-9]+\.[0-9]+-latest-$t-gpl-[0-9]+\.[0-9]+\.(zip|tar\.xz)$" | sort -V | tail -1)
          if [ -z "$asset" ]; then asset=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets -q '.assets[].name' | grep -E "^ffmpeg-master-latest-$t-gpl\.(zip|tar\.xz)$" | head -1); fi
          echo "FFmpeg: $asset"
          gh release download latest -R BtbN/FFmpeg-Builds -p "$asset" -D ffdl
          mkdir -p ffx
          case "$asset" in
            *.zip) if command -v unzip >/dev/null; then unzip -q "ffdl/$asset" -d ffx; else 7z x -offx "ffdl/$asset" >/dev/null; fi ;;
            *) tar -xJf "ffdl/$asset" -C ffx ;;
          esac
          mkdir -p "$k/tools/ffmpeg"
          for exe in ffmpeg ffprobe ffmpeg.exe ffprobe.exe; do
            f=$(find ffx -type f -name "$exe" | head -1)
            if [ -n "$f" ]; then cp "$f" "$k/tools/ffmpeg/"; fi
          done
          ls "$k/tools/ffmpeg" | grep -q '^ffmpeg' || { echo "::error::FFmpeg not found in $asset"; exit 1; }
          lic=$(find ffx -maxdepth 2 -type f -name 'LICENSE*' | head -1)
          if [ -n "$lic" ]; then cp "$lic" "$k/tools/ffmpeg/LICENSE.txt"; fi
          printf '%s\n' "FFmpeg $asset - https://github.com/BtbN/FFmpeg-Builds (build scripts) and https://ffmpeg.org (source code)." \
            "GPL licensed: see LICENSE.txt. KnA runs it as a separate program." > "$k/tools/ffmpeg/SOURCE.txt"
          cat > "$k/portable.txt" <<'EOF'
          KnA portable: everything stays in this folder. data = settings, presets, queue, logs, temporary files;
          tools = FFmpeg, fdkaac and the other programs (updates from Settings → Components go here too);
          ai = the AI upscaler (portable Python, PyTorch, models) when installed.
          Delete this file to use the per-user folder instead.

          KnA portable: tutto resta in questa cartella. data = impostazioni, preset, coda, log, file temporanei;
          tools = FFmpeg, fdkaac e gli altri programmi (anche gli aggiornamenti da Impostazioni → Componenti);
          ai = l'upscaler AI (Python portabile, PyTorch, modelli) quando installato.
          Elimina questo file per usare la cartella dell'utente.
          EOF
          sed -i.bak 's/^          //' "$k/portable.txt" && rm "$k/portable.txt.bak"
          mkdir -p "$k/data"
          ls -R "$k" | head -40
      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path portable/KnA -DestinationPath KnA-portable-${{ matrix.rid }}.zip
      - name: Portable tarball (Linux)
        if: runner.os == 'Linux'
        run: tar -C portable -czf KnA-portable-${{ matrix.rid }}.tar.gz KnA
      - name: macOS app bundle (icon, Finder, Dock)
        if: runner.os == 'macOS'
        run: |
          app=KnA.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R out/desktop/. "$app/Contents/MacOS/"
          cp branding/kna.icns "$app/Contents/Resources/kna.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>KnA</string>
            <key>CFBundleDisplayName</key><string>KnA · Konjiki no Autoencoder</string>
            <key>CFBundleIdentifier</key><string>io.github.konjikinoyami1991.kna</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleExecutable</key><string>KnA</string>
            <key>CFBundleIconFile</key><string>kna.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          sed -i '' 's/^          //' "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app" || true
          ditto -c -k --keepParent "$app" "KnA-macOS-${{ matrix.rid }}.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kna-${{ matrix.rid }}
          path: |
            KnA-*.zip
            KnA-*.tar.gz

  release:
    needs: [fdkaac, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Release notes: this version's section of CHANGELOG.md (GitHub's generated list of changes is appended).
      - name: Notes from the changelog
        run: |
          awk -v tag="$TAG" '$0 ~ "^## " tag "([^0-9.]|$)" {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md > notes.md
          wc -l notes.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          draft=--draft
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.draft }}" == false ]]; then draft=; fi
          notes=(); [[ -s notes.md ]] && notes=(--notes-file notes.md)
          gh release create "$TAG" dist/*.zip dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $draft "${notes[@]}" --generate-notes --title "KnA $TAG"
