name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: dotnet build KnA.slnx -c Release
      - run: dotnet test KnA.slnx -c Release --no-build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kna .

  publish:
    needs: test
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: ubuntu-24.04, rid: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/KnA.App -c Release -r ${{ matrix.rid }} --self-contained -o out/desktop
      - run: dotnet publish src/KnA.Server -c Release -r ${{ matrix.rid }} --self-contained -o out/server
      - uses: actions/upload-artifact@v4
        with:
          name: kna-${{ matrix.rid }}
          path: out/
